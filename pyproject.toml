[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pybuildx"
version = "0.0.1"
description = "Build Python applications with one command"
requires-python = ">=3.10"
dependencies = [
    "pyinstaller"
]

[project.scripts]
pybuildx = "pybuildx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
